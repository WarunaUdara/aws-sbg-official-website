name: CI/CD Pipeline - Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build Application (Prerendered)
        run: bun run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: client-dist
          path: dist/client
          retention-days: 1

  deploy-production:
    name: Deploy to Cloudflare Pages (Production)
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: dist/client

      - name: Validate Cloudflare Credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing_credentials=""
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing_credentials="CLOUDFLARE_API_TOKEN"
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            missing_credentials="${missing_credentials:+$missing_credentials, }CLOUDFLARE_ACCOUNT_ID"
          fi

          if [[ -n "$missing_credentials" ]]; then
            echo "::error title=Missing Cloudflare credentials::Configure these GitHub repository secrets before deploying: $missing_credentials"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run deploy -- --commit-dirty=true

  deploy-preview:
    name: Deploy to Cloudflare Pages (Preview)
    needs: build-and-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: dist/client

      - name: Validate Cloudflare Credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing_credentials=""
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing_credentials="CLOUDFLARE_API_TOKEN"
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            missing_credentials="${missing_credentials:+$missing_credentials, }CLOUDFLARE_ACCOUNT_ID"
          fi

          if [[ -n "$missing_credentials" ]]; then
            echo "::error title=Missing Cloudflare credentials::Configure these GitHub repository secrets before deploying preview builds: $missing_credentials"
            exit 1
          fi

      - name: Deploy Preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run deploy -- --branch=${{ github.head_ref }} --commit-dirty=true
